<section
  id="page-scan"
  class="page"
  hidden
>

  <div class="page-header page-header-inline">
    <button
      type="button"
      class="page-back-button"
      aria-label="Volver al inicio"
      data-back-to-home="true"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          d="M15 18L9 12L15 6"
          fill="none"
          stroke="currentColor"
          stroke-width="2.3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>

    <div class="page-header-copy">
      <h2>Escanear medición</h2>

      <p>
        Coloca la pantalla del baumanómetro frente a la cámara.
      </p>
    </div>
  </div>

  <div class="scan-container">

    <div class="camera-container">

      <video
        id="cameraVideo"
        class="camera-video"
        autoplay
        playsinline
        muted
      ></video>

      <canvas
        id="scanCapturedCanvas"
        class="camera-captured-canvas"
        hidden
        aria-label="Imagen capturada de la medición"
      ></canvas>

      <div class="camera-frame">

        <div class="camera-frame-corner top-left"></div>
        <div class="camera-frame-corner top-right"></div>
        <div class="camera-frame-corner bottom-left"></div>
        <div class="camera-frame-corner bottom-right"></div>

      </div>

    </div>

    {{SCAN_RESULT}}

    <div
      id="scanMessage"
      class="scan-message"
      aria-live="polite"
    >
      Coloca la pantalla dentro del recuadro.
    </div>

  </div>

</section>
