<section
  id="page-scan"
  class="page"
  hidden
>

  <div class="page-header">

    <h2>Escanear medición</h2>

    <p>
      Coloca la pantalla del baumanómetro frente a la cámara.
    </p>

  </div>

  <div class="scan-container">

    <div class="camera-container">

      <video
        id="cameraVideo"
        class="camera-video"
        autoplay
        playsinline
        muted
      ></video>

      <div class="camera-frame">

        <div class="camera-frame-corner top-left"></div>
        <div class="camera-frame-corner top-right"></div>
        <div class="camera-frame-corner bottom-left"></div>
        <div class="camera-frame-corner bottom-right"></div>

      </div>

    </div>

    {{SCAN_RESULT}}

    <div
      id="scanMessage"
      class="scan-message"
      aria-live="polite"
    >
      Coloca la pantalla dentro del recuadro.
    </div>

    <div class="scan-actions">
      <button
        type="button"
        id="stopCameraButton"
        class="secondary-button"
        hidden
      >
        Detener cámara
      </button>

    </div>

  </div>

</section>
