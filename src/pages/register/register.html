<section id="page-register" class="page active">
  <div class="page-header">
    <h2>Registrar medición</h2>
    <p>Ingresa los datos de tu medición.</p>
  </div>

  <form id="bloodPressureForm" class="blood-pressure-form">

    <div class="form-row">
      <div class="form-field">
        <label for="fecha">Fecha</label>

        <div class="date-time-control">
          <span class="date-time-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <rect x="3" y="5" width="18" height="16" rx="2" />
              <path d="M16 3v4M8 3v4M3 10h18" />
            </svg>
          </span>

          <input
            type="date"
            id="fecha"
            name="fecha"
            required
          />
        </div>
      </div>

      <div class="form-field">
        <label for="hora">Hora</label>

        <div class="date-time-control">
          <span class="date-time-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3 2" />
            </svg>
          </span>

          <input
            type="time"
            id="hora"
            name="hora"
            required
          />
        </div>
      </div>
    </div>


    <div class="measurement-card">

      <div class="form-field">
        <label for="sistolica">Sistólica</label>

        <div class="input-with-unit">
          <input
            type="number"
            id="sistolica"
            name="sistolica"
            inputmode="numeric"
            maxlength="3"
            min="50"
            max="250"
            placeholder="120"
            required
          />

          <span>mmHg</span>
        </div>
      </div>


      <div class="form-field">
        <label for="diastolica">Diastólica</label>

        <div class="input-with-unit">
          <input
            type="number"
            id="diastolica"
            name="diastolica"
            inputmode="numeric"
            maxlength="3"
            min="30"
            max="150"
            placeholder="80"
            required
          />

          <span>mmHg</span>
        </div>
      </div>


      <div class="form-field">
        <label for="pulso">Pulso</label>

        <div class="input-with-unit">
          <input
            type="number"
            id="pulso"
            name="pulso"
            inputmode="numeric"
            maxlength="3"
            min="30"
            max="220"
            placeholder="70"
            required
          />

          <span>lpm</span>
        </div>
      </div>

    </div>


    <fieldset class="form-field arm-field">
      <legend>Brazo</legend>

      <div class="arm-toggle">
        <input
          type="radio"
          id="brazo-izquierdo"
          name="brazo"
          value="Izquierdo"
          checked
        />
        <label for="brazo-izquierdo">Izquierdo</label>

        <input
          type="radio"
          id="brazo-derecho"
          name="brazo"
          value="Derecho"
        />
        <label for="brazo-derecho">Derecho</label>
      </div>
    </fieldset>


    <div class="form-field">
      <label for="sintomas">Síntomas</label>

      <input
        type="text"
        id="sintomas"
        name="sintomas"
        maxlength="25"
        pattern="[\p{L}\s]*"
        placeholder="Ej. Dolor de cabeza"
      />
    </div>


    <div class="form-field">
      <label for="observaciones">Observaciones</label>

      <textarea
        id="observaciones"
        name="observaciones"
        rows="3"
        maxlength="100"
        placeholder="Notas adicionales..."
      ></textarea>

      <span
        id="observacionesCounter"
        class="character-counter"
        aria-live="polite"
      >00/100</span>
    </div>


    <div
      id="formMessage"
      class="form-message"
      aria-live="polite"
    ></div>


    <button
      type="submit"
      id="saveButton"
      class="primary-button"
      disabled
    >
      Guardar medición
    </button>

  </form>
</section>
