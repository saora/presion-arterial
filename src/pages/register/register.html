<section id="page-register" class="page active">
  <div class="page-header">
    <h2>Registrar medición</h2>
    <p>Ingresa los datos de tu medición.</p>
  </div>

  <form id="bloodPressureForm" class="blood-pressure-form">

    <div class="form-row">
      <div class="form-field">
        <label for="fecha">Fecha</label>

        <input
          type="date"
          id="fecha"
          name="fecha"
          required
        />
      </div>

      <div class="form-field">
        <label for="hora">Hora</label>

        <input
          type="time"
          id="hora"
          name="hora"
          required
        />
      </div>
    </div>


    <div class="measurement-card">

      <div class="form-field">
        <label for="sistolica">Sistólica</label>

        <div class="input-with-unit">
          <input
            type="number"
            id="sistolica"
            name="sistolica"
            inputmode="numeric"
            min="50"
            max="250"
            placeholder="120"
            required
          />

          <span>mmHg</span>
        </div>
      </div>


      <div class="form-field">
        <label for="diastolica">Diastólica</label>

        <div class="input-with-unit">
          <input
            type="number"
            id="diastolica"
            name="diastolica"
            inputmode="numeric"
            min="30"
            max="150"
            placeholder="80"
            required
          />

          <span>mmHg</span>
        </div>
      </div>


      <div class="form-field">
        <label for="pulso">Pulso</label>

        <div class="input-with-unit">
          <input
            type="number"
            id="pulso"
            name="pulso"
            inputmode="numeric"
            min="30"
            max="220"
            placeholder="70"
            required
          />

          <span>lpm</span>
        </div>
      </div>

    </div>


    <div class="form-field">
      <label for="brazo">Brazo</label>

      <select id="brazo" name="brazo">
        <option value="Izquierdo">Izquierdo</option>
        <option value="Derecho">Derecho</option>
      </select>
    </div>


    <div class="form-field">
      <label for="sintomas">Síntomas</label>

      <input
        type="text"
        id="sintomas"
        name="sintomas"
        placeholder="Ej. Dolor de cabeza"
      />
    </div>


    <div class="form-field">
      <label for="observaciones">Observaciones</label>

      <textarea
        id="observaciones"
        name="observaciones"
        rows="3"
        placeholder="Notas adicionales..."
      ></textarea>
    </div>


    <div
      id="formMessage"
      class="form-message"
      aria-live="polite"
    ></div>


    <button
      type="submit"
      id="saveButton"
      class="primary-button"
      disabled
    >
      Guardar medición
    </button>

  </form>
</section>
