<div class="app">

  {{HEADER}}

  <main class="app-content">

    {{HOME}}

    {{REGISTER}}

    {{SCAN}}

    {{HISTORY}}

    {{PROFILE}}

  </main>

  <div
    id="registerChoiceModal"
    class="register-choice-modal"
    hidden
    aria-hidden="true"
  >
    <div
      class="register-choice-backdrop"
      data-close-modal="true"
    ></div>

    <div
      class="register-choice-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="registerChoiceTitle"
    >
      <button
        type="button"
        class="modal-close-icon"
        aria-label="Cerrar"
        data-close-modal="true"
      >
        ×
      </button>

      <h3 id="registerChoiceTitle">¿Cómo quieres registrar?</h3>

      <div class="register-choice-actions">
        <button
          type="button"
          class="choice-button choice-button-primary"
          data-register-choice="manual"
        >
          Manual
        </button>

        <button
          type="button"
          class="choice-button choice-button-icon"
          data-register-choice="scan"
          aria-label="Escanear medición"
        >
          <svg
            class="choice-button-icon-svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M7 4H5a1 1 0 0 0-1 1v2M17 4h2a1 1 0 0 1 1 1v2M7 20H5a1 1 0 0 1-1-1v-2M17 20h2a1 1 0 0 0 1-1v-2"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />

            <circle
              cx="12"
              cy="12"
              r="3"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />
          </svg>
        </button>
      </div>

    </div>
  </div>

  <div
    id="deleteRecordModal"
    class="register-choice-modal"
    hidden
    aria-hidden="true"
  >
    <div class="register-choice-backdrop" data-close-delete-modal="true"></div>

    <div
      class="register-choice-panel"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="deleteRecordTitle"
      aria-describedby="deleteRecordDescription"
    >
      <h3 id="deleteRecordTitle">¿Eliminar medición?</h3>
      <p id="deleteRecordDescription" class="delete-record-description">
        Esta acción no se puede deshacer.
      </p>

      <div id="deleteRecordFeedback" class="save-record-feedback" hidden aria-live="polite">
        <span id="deleteRecordFeedbackIcon" class="save-record-feedback-icon" aria-hidden="true"></span>
        <p id="deleteRecordFeedbackMessage"></p>
      </div>

      <div id="deleteRecordActions" class="register-choice-actions">
        <button
          type="button"
          id="cancelDeleteRecord"
          class="choice-button"
        >
          Cancelar
        </button>
        <button
          type="button"
          id="confirmDeleteRecord"
          class="choice-button choice-button-danger"
        >
          Aceptar
        </button>
      </div>
    </div>
  </div>

  <div
    id="saveRecordModal"
    class="register-choice-modal"
    hidden
    aria-hidden="true"
  >
    <div class="register-choice-backdrop" data-close-save-modal="true"></div>

    <div
      class="register-choice-panel"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="saveRecordTitle"
    >
      <h3 id="saveRecordTitle">¿Deseas guardar este registro?</h3>
      <div id="saveRecordFeedback" class="save-record-feedback" hidden aria-live="polite">
        <span id="saveRecordFeedbackIcon" class="save-record-feedback-icon" aria-hidden="true"></span>
        <p id="saveRecordFeedbackMessage"></p>
      </div>

      <div id="saveRecordActions" class="register-choice-actions">
        <button
          type="button"
          id="cancelSaveRecord"
          class="choice-button"
        >
          Cancelar
        </button>
        <button
          type="button"
          id="confirmSaveRecord"
          class="choice-button choice-button-primary"
        >
          Aceptar
        </button>
      </div>
    </div>
  </div>

  {{NAVIGATION}}

</div>
