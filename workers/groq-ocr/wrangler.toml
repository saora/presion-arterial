name = "presion-arterial-groq-ocr"
main = "src/index.ts"
compatibility_date = "2026-10-08"

[vars]
GROQ_MODEL = "qwen/qwen3.8-27b"
ALLOWED_ORIGINS = "https://saora.github.io,http://localhost:5173,http://127.0.0.1:5173"

[[ratelimits]]
name = "OCR_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60
