<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba cámara</title>
</head>

<body>

  <h1>Prueba de cámara</h1>

  <video
    id="video"
    autoplay
    playsinline
    muted
    style="width:100%; max-width:500px;">
  </video>

  <script>

    async function startCamera() {

      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: {
                ideal: 'environment'
              }
            },
            audio: false
          });

        document.getElementById('video').srcObject =
          stream;

      } catch (error) {

        console.error(error);

        document.body.innerHTML +=
          '<p>' +
          error.name +
          ': ' +
          error.message +
          '</p>';

      }

    }

    startCamera();

  </script>

</body>

</html>
